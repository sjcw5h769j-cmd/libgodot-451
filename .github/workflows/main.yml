name: Build Godot 4.5.1 iOS LibGodot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: |
          python3 -m pip install --user --break-system-packages scons
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Check SCons
        run: |
          which scons
          scons --version

      - name: Patch host build for native Metal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_libgodot.sh")
          s = p.read_text()

          old = 'host_build_options=""'
          new = 'host_build_options="vulkan=no metal=yes"'

          if old not in s:
              raise SystemExit("host_build_options line not found")

          p.write_text(s.replace(old, new, 1))
          print("Patched host build: vulkan=no metal=yes")
          PY

      - name: Build LibGodot
        run: |
          chmod +x build_prebuilt_dev.sh
          ./build_prebuilt_dev.sh

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.5.1-ios-libgodot
          path: |
            build/libgodot/dev/libgodot.xcframework
            build/godot-cpp/dev/libgodot-cpp.xcframework
