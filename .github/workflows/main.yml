name: Build Godot 4.5.1 iOS LibGodot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h

          sudo rm -rf ~/Library/Developer/Xcode/DerivedData
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport/*

          echo "=== After cleanup ==="
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: |
          python3 -m pip install --user --break-system-packages scons
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Check SCons
        run: |
          which scons
          scons --version

      - name: Patch host build for Metal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_libgodot.sh")
          s = p.read_text()

          old = 'host_build_options=""'
          new = 'host_build_options="vulkan=no metal=yes"'

          if old not in s:
              raise SystemExit("host_build_options line not found")

          p.write_text(s.replace(old, new, 1))
          print("Host build patched for Metal.")
          PY

      - name: Build host and update API
        run: |
          chmod +x build_libgodot.sh
          ./build_libgodot.sh \
            --no-target \
            --host-rebuild \
            --host-release \
            --update-api

      - name: Show disk space before iOS build
        run: |
          df -h

      - name: Build iOS device
        run: |
          ./build_libgodot.sh --target ios --dev

      - name: Clean unnecessary build data
        run: |
          df -h

          rm -rf build/prebuilt
          rm -rf build/android
          rm -rf build/godot-cpp-android

          df -h

      - name: Build iOS simulator
        run: |
          ./build_libgodot.sh --target ios --simulator --dev

      - name: Build iOS XCFramework
        run: |
          chmod +x build_libgodot_xcframework.sh
          ./build_libgodot_xcframework.sh --target template_dev

      - name: Build Godot CPP XCFramework
        run: |
          chmod +x build_godotcpp_xcframework.sh
          ./build_godotcpp_xcframework.sh --target template_dev

      - name: Package artifacts
        run: |
          mkdir -p artifacts

          cp -R \
            build/libgodot/dev/libgodot.xcframework \
            artifacts/

          cp -R \
            build/godot-cpp/dev/libgodot-cpp.xcframework \
            artifacts/

          df -h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.5.1-ios-libgodot
          path: artifacts/
